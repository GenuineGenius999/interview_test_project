services:
    nginx:
        build:
            context: .docker/nginx
            dockerfile: Dockerfile
            args:
                UID: "${DOCKER_UID:-1000}"
                GID: "${DOCKER_GID:-1000}"
        depends_on:
            php:
                condition: service_healthy
        ports:
            - "${APP_PORT:-8080}:80"
        volumes:
            - ./:/var/www/html:ro
        networks:
            - interview_test
        restart: unless-stopped

    php:
        build:
            context: .
            dockerfile: .docker/php/Dockerfile
            args:
                UID: "${DOCKER_UID:-1000}"
                GID: "${DOCKER_GID:-1000}"
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            APP_NAME: "${APP_NAME:-Interview Test Project}"
            APP_ENV: "${APP_ENV:-local}"
            APP_KEY: "${APP_KEY:-base64:2wI/DOh8QhuzVpY8/1JmskqWbWKMqtrzxRP9xHZBzeI=}"
            APP_DEBUG: "${APP_DEBUG:-true}"
            APP_URL: "${APP_URL:-http://localhost:8080}"
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: "${DB_DATABASE:-interview_test}"
            DB_USERNAME: "${DB_USERNAME:-interview_test}"
            DB_PASSWORD: "${DB_PASSWORD:-interview_test}"
        volumes:
            - ./:/var/www/html
            - composer_vendor:/var/www/html/vendor
        networks:
            - interview_test
        healthcheck:
            test: ["CMD", "php-fpm", "-t"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    npm:
        image: node:18-bullseye-slim
        working_dir: /var/www/html
        command: sh -c "chown -R node:node /var/www/html/node_modules && su node -s /bin/sh -c 'npm run watch-poll'"
        volumes:
            - ./:/var/www/html
            - npm_node_modules:/var/www/html/node_modules
        networks:
            - interview_test
        tty: true
        restart: unless-stopped

    mysql:
        image: mysql:5.7.31
        environment:
            MYSQL_DATABASE: "${DB_DATABASE:-interview_test}"
            MYSQL_USER: "${DB_USERNAME:-interview_test}"
            MYSQL_PASSWORD: "${DB_PASSWORD:-interview_test}"
            MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-interview_test_root}"
        ports:
            - "${DB_FORWARD_PORT:-3307}:3306"
        volumes:
            - mysql_data:/var/lib/mysql
            - ./.docker/mysql/init:/docker-entrypoint-initdb.d:ro
        networks:
            - interview_test
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
            interval: 5s
            timeout: 5s
            retries: 20
        restart: unless-stopped

networks:
    interview_test:
        driver: bridge

volumes:
    composer_vendor:
    mysql_data:
    npm_node_modules:
